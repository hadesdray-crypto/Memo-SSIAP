name: Veille réglementaire
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: veille
  cancel-in-progress: false
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
      - name: Vérifier les textes officiels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node veille.mjs
      - name: Publier le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille.json veille-etat.json
          if ! git diff --cached --quiet; then
            git commit -m "Veille réglementaire du $(date -u +%F)"
            git push
          fi
          curl -s -o /dev/null -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
