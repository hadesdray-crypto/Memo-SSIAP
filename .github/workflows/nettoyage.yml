name: Nettoyage unique de l'historique

on:
  push:
    paths: [".github/nettoyage-demande"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supprimer anciennes versions, étiquettes et branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh release list -R $R --limit 200 --json tagName -q '.[].tagName' > tags.txt
          KEEP_A=$(grep '^android-' tags.txt | sort -V | tail -1)
          KEEP_E=$(grep '^essai-' tags.txt | sort -V | tail -1)
          echo "On garde $KEEP_A et $KEEP_E"
          for t in $(cat tags.txt); do
            if [ "$t" != "$KEEP_A" ] && [ "$t" != "$KEEP_E" ]; then gh release delete "$t" -R $R --yes --cleanup-tag || true; fi
          done
          for t in $(git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}'); do
            if [ "$t" != "$KEEP_A" ] && [ "$t" != "$KEEP_E" ]; then git push origin --delete "$t" || true; fi
          done
          for b in $(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -v '^main$'); do
            git push origin --delete "$b" || true
          done
